<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .conteiner {
            border: 3px solid blue;
            height: 300px;
            display: grid;
            grid-auto-flow: column;
            grid-template: repeat(2, 1fr) 2fr / 100px 1fr 20% 2fr;
            gap: 20px;
            place-items: stretch stretch;
            place-content: start start;
            grid-auto-rows: 100px;
            grid-auto-columns: 200px;
        }
        .item {
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <main class="conteiner">
        <div class="item">Conteúdo A</div>
        <div class="item">Conteúdo B</div>
        <div class="item">Conteúdo C</div>
        <div class="item">Conteúdo D</div>
        <div class="item">Conteúdo EEE</div>
        <div class="item">Conteúdo F</div>
        <div class="item">Conteúdo G</div>
        <div class="item">Conteúdo H</div>
        <div class="item">Conteúdo I</div>
        <div class="item">Conteúdo J</div>
    </main>    
</body>
</html>
