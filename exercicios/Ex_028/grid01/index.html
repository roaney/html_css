<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .conteiner {
            border: 3px solid blue;
            display: grid;
            height: 400px;
            grid-template-columns: 100px auto 100px;
            grid-template-rows: 100px auto 100px;
            justify-content: space-evenly;
            align-items: start;
            
            
        }
        .item {
            border: 2px solid green;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="conteiner">
        <div class="item">Conteúdo A</div>
        <div class="item">Conteúdo B</div>
        <div class="item">Conteúdo C</div>
        <div class="item">Conteúdo D</div>
        <div class="item">Conteúdo E</div>
        <div class="item">Conteúdo F</div>
        <div class="item">Conteúdo G</div>
    </main>    
</body>
</html>
