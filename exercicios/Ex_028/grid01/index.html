<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .conteiner {
            border: 3px solid blue;
            height: 400px;
            display: grid;
            grid-template-columns: 200px auto auto;
            grid-template-rows: auto 100px auto;
            gap: 20px;
            justify-items: end;
            justify-content: space-evenly;
            align-items: center;
            align-content: stretch;
        }
        .item {
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <main class="conteiner">
        <div class="item">Conteúdo A</div>
        <div class="item">Conteúdo B</div>
        <div class="item">Conteúdo C</div>
        <div class="item">Conteúdo D</div>
        <div class="item">Conteúdo EEE</div>
        <div class="item">Conteúdo F</div>
        <div class="item">Conteúdo G</div>
    </main>    
</body>
</html>
