<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>
        Teste de Formulário
    </h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required placeholder="nome completo" autocomplete="name" size="40">
        </p>
        <p>
            <label for="media">Média</label>
            <input type="number" name="media" id="media" required min="0" max="10" placeholder="0 a 10" step="0.5">
        </p>
        <p>
            <label for="mes">Pedíodo Letivo</label>
            <input type="month" name="mes" id="mes" required value="2025-09">
        </p>
        <p>
            <label for="dia">Dia da Prova</label>
            <input type="date" name="dia" id="dia" required value="2025-09-15">
        </p>
        <p>
            <label for="hora">Hora da Prova</label>
            <input type="time" name="hora" id="hora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
