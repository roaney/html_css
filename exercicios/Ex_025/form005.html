<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .verde {
            background-color: rgb(30, 255, 0);
            border: 1px solid rgb(78, 78, 78);
            border-radius: 4px;
            font-weight: bold;
        }
        fieldset {
            margin-bottom: 10px;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>
        Exemplo de Formulário
    </h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="mas" value="M">
            <label for="mas">Masculino</label>
            <input type="radio" name="sex" id="fem" value="F">
            <label for="fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="bas" id="bas">
            <label for="bas">Basquete</label>
            <input type="checkbox" name="fut" id="fut" checked>
            <label for="fut">Futebol</label>
            <input type="checkbox" name="nat" id="nat">
            <label for="nat">Natação</label>
            <input type="checkbox" name="ten" id="ten">
            <label for="ten">Tênis</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar" class="verde">
            <input type="reset" value="Limpar" class="verde">
        </p>
    </form>
</body>
</html>
