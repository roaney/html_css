<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .conteiner {
            display: flex;
            background-color: crimson;
            height: 300px;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: flex-start;
        }
        .item {
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 0;
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" style="flex-grow: 1;">Exemplo de bloco A</div>
        <div class="item" style="flex-grow: 2;">Exemplo de bloco B</div>
        <div class="item" style="flex-grow: 5;">Exemplo de bloco C</div>
    </div>
</body>
</html>
